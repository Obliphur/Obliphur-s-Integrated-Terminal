<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OIT Chat</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--color-background-primary, #14161a);
      color: var(--color-text-primary, #e7eaf0);
      font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
      font-size: 13px;
    }
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--color-border-secondary, rgba(255,255,255,0.1));
      background: var(--color-background-secondary, #1b1e24);
      gap: 8px;
    }
    .persona {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--color-background-tertiary, #2a2f3a);
      flex-shrink: 0;
    }
    .persona-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-pill {
      font-size: 11px;
      color: var(--color-text-secondary, #9aa4b2);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--color-border-secondary, rgba(255,255,255,0.08));
      background: var(--color-background-secondary, #1b1e24);
    }
    .tbtn {
      border: 1px solid var(--color-border-secondary, rgba(255,255,255,0.12));
      background: var(--color-background-primary, #14161a);
      color: var(--color-text-primary, #e7eaf0);
      border-radius: 6px;
      padding: 3px 7px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.2;
    }
    .tbtn.active {
      border-color: var(--color-ring-info, #4c8bf5);
      background: var(--color-background-info, rgba(76,139,245,0.18));
    }
    .banners {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 10px;
    }
    .banner {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--color-background-info, rgba(76,139,245,0.14));
      border: 1px solid var(--color-border-info, rgba(76,139,245,0.35));
    }
    .banner-actions { display: flex; gap: 6px; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row { display: flex; flex-direction: column; max-width: 86%; }
    .row.me { align-self: flex-end; align-items: flex-end; }
    .row.ai { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 8px 11px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }
    .row.me .bubble {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .row.ai .bubble {
      background: var(--color-background-secondary, #232730);
      color: var(--color-text-primary, #e7eaf0);
      border-bottom-left-radius: 4px;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 11px;
      color: var(--color-text-tertiary, #7f8998);
    }
    .composer {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      border-top: 1px solid var(--color-border-secondary, rgba(255,255,255,0.1));
      background: var(--color-background-secondary, #1b1e24);
    }
    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 36px;
      max-height: 110px;
      border-radius: 8px;
      border: 1px solid var(--color-border-secondary, rgba(255,255,255,0.14));
      background: var(--color-background-primary, #14161a);
      color: var(--color-text-primary, #e7eaf0);
      padding: 8px;
      font: inherit;
    }
    .send-btn {
      padding: 0 14px;
      border-radius: 8px;
      border: none;
      background: var(--color-ring-info, #3b82f6);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint {
      text-align: center;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--color-text-secondary, #9aa4b2);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="persona">
        <img id="avatar" class="avatar" alt="" style="display:none" />
        <div>
          <div id="personaName" class="persona-name">OIT Chat</div>
          <div id="statusPill" class="status-pill">连接中…</div>
        </div>
      </div>
      <button id="btnClear" class="tbtn" title="清空">🗑</button>
    </div>

    <div class="toolbar">
      <button class="tbtn" data-action="toggle_scenario" id="btnScenario" title="情景模式">📱</button>
      <button class="tbtn" data-action="toggle_mute" id="btnMute" title="主动消息开关">🔔</button>
      <button class="tbtn" data-action="toggle_co_alarm" id="btnAlarm" title="共时闹钟">⏲</button>
      <button class="tbtn" data-action="toggle_share" id="btnShare" title="Share Data">🙈</button>
      <button class="tbtn" data-dialog="joint" title="联合行动">🤝</button>
      <button class="tbtn" data-dialog="shift" title="起点平移">🕰</button>
      <button class="tbtn" data-dialog="review" title="演奏评判 (MIDI)">🎼</button>
      <button class="tbtn" data-dialog="coread" title="共读">📚</button>
      <button class="tbtn" data-dialog="ocr" title="独立识字">🖼</button>
    </div>

    <div id="banners" class="banners"></div>
    <div id="messages" class="messages"></div>

    <div id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送（中途发送会撤销未弹出气泡）"></textarea>
      <button id="btnSend" class="send-btn">发送</button>
    </div>
    <div id="readonlyHint" class="hint" style="display:none">当前尚未进入具体对话，请先在左侧发送第一条消息建立会话后即可在此输入。</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
